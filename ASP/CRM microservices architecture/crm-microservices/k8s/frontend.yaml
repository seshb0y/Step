apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: crm-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: seshb0y/frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          env:
            - name: REACT_APP_API_URL
              value: "http://crm.local/api"
            - name: REACT_APP_SIGNALR_URL
              value: "http://crm.local/hub"
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
      volumes:
        - name: nginx-config
          configMap:
            name: frontend-nginx-config

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx-config
  namespace: crm-system
data:
  nginx.conf: |
    server {
        listen 80;
        server_name localhost;

        # Проксирование API
        location /api/ {
            proxy_pass http://apigateway:80/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Отдача JS
        location ~* \.(js|mjs)$ {
            add_header Content-Type application/javascript;
            try_files $uri =404;
        }

        # Отдача CSS
        location ~* \.css$ {
            add_header Content-Type text/css;
            try_files $uri =404;
        }

        # Изображения и шрифты
        location ~* \.(png|jpe?g|gif|ico|svg|woff2?|ttf|eot)$ {
            add_header Cache-Control "public";
            expires 1y;
            try_files $uri =404;
        }

        # Главная точка входа (SPA fallback)
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }

---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: crm-system
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
