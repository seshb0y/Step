apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: crm-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: crm-microservices-authservice:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 5171
              name: http
            - containerPort: 5172
              name: grpc
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Development"
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: auth-connection-string
---
