version: "3.9"

services:
  frontend:
    image: seshb0y/frontend:latest
    platform: windows/amd64
    container_name: crm_frontend
    ports:
      - "3000:80"
    depends_on:
      - apigateway
    networks:
      - crm_network

  twilio-db:
    image: postgres:16
    container_name: twilio_postgres
    environment:
      POSTGRES_DB: twilio_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    ports:
      - "5448:5432"
    volumes:
      - twilio_pgdata:/var/lib/postgresql/data
    networks:
      - crm_network

  auth-db:
    image: postgres:16
    container_name: auth_postgres
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    ports:
      - "5444:5432"
    volumes:
      - auth_pgdata:/var/lib/postgresql/data
    networks:
      - crm_network

  client-db:
    image: postgres:16
    container_name: client_postgres
    environment:
      POSTGRES_DB: client_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    ports:
      - "5447:5432"
    volumes:
      - client_pgdata:/var/lib/postgresql/data
    networks:
      - crm_network

  order-db:
    image: postgres:16
    container_name: order_postgres
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    ports:
      - "5445:5432"
    volumes:
      - order_pgdata:/var/lib/postgresql/data
    networks:
      - crm_network

  task-db:
    image: postgres:16
    container_name: task_postgres
    environment:
      POSTGRES_DB: task_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    ports:
      - "5446:5432"
    volumes:
      - task_pgdata:/var/lib/postgresql/data
    networks:
      - crm_network

  twilioservice:
    image: seshb0y/twilioservice:latest
    platform: windows/amd64
    depends_on:
      - twilio-db
    networks:
      - crm_network
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=twilio-db;Database=twilio_db;Username=postgres;Password=secret

  authservice:
    image: seshb0y/authservice:latest
    platform: windows/amd64
    depends_on:
      - auth-db
    networks:
      - crm_network
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=auth-db;Database=auth_db;Username=postgres;Password=secret

  clientservice:
    image: seshb0y/clientservice:latest
    platform: windows/amd64
    depends_on:
      - client-db
    networks:
      - crm_network
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=client-db;Database=client_db;Username=postgres;Password=secret

  orderservice:
    image: seshb0y/orderservice:latest
    platform: windows/amd64
    depends_on:
      - order-db
    networks:
      - crm_network
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=order-db;Database=order_db;Username=postgres;Password=secret

  taskservice:
    image: seshb0y/taskservice:latest
    platform: windows/amd64
    depends_on:
      - task-db
    networks:
      - crm_network
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=task-db;Database=task_db;Username=postgres;Password=secret

  apigateway:
    image: seshb0y/apigateway:latest
    platform: windows/amd64
    depends_on:
      - authservice
      - clientservice
      - orderservice
      - taskservice
    ports:
      - "5241:80"
    networks:
      - crm_network
    environment:
      - ASPNETCORE_ENVIRONMENT=Development

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - apigateway
    networks:
      - crm_network

networks:
  crm_network:
    driver: bridge

volumes:
  auth_pgdata:
  client_pgdata:
  order_pgdata:
  task_pgdata:
  twilio_pgdata:
