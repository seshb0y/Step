version: '3.8'
services:
  twilio-db:
    image: postgres:16
    container_name: twilio_postgres
    environment:
      POSTGRES_DB: twilio_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    ports:
      - "5448:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  pgdata:
