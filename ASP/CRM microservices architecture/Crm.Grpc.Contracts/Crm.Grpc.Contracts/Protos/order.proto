syntax = "proto3";

option csharp_namespace = "CRMSolution.Grpc.Orders"; 

package order;

enum OrderStatus {
  NEW = 0;
  PROCESSING = 1;
  COMPLETED = 2;
}

service OrderGrpcService {
  rpc GetOrderById (GetOrderByIdRequest) returns (OrderDto);
  rpc CreateOrder (CreateOrderRequest) returns (CreateOrderResponse);
  rpc ChangeOrderData (ChangeOrderDataRequest) returns (ChangeOrderDataResponse);
  rpc DeleteOrder(DeleteOrderRequest) returns (DeleteOrderResponse);
  rpc GetOrderFullInfo(GetOrderFullInfoRequest) returns (GetOrderFullInfoResponse);
}

message GetOrderByIdRequest {
  int32 orderId = 1;
}
message OrderDto {
  string id = 1;
  double totalAmount = 2;
  string status = 3;
  int32 userId = 4;
  int32 clientId = 5;
}

message ChangeOrderDataRequest {
  double totalAmount = 1;
  OrderStatus status = 2;
  int32 orderId = 3;
}
message ChangeOrderDataResponse {
  bool success = 1;
  string message = 2;
}

message CreateOrderRequest{
  double totalAmount = 1;
  string clientEmail = 2;
  string userEmail = 3;
}
message CreateOrderResponse{
  bool success = 1;
  string message = 2;
}

message DeleteOrderRequest{
  int32 orderId = 1;
}
message DeleteOrderResponse{
  bool success = 1;
  string message = 2;
}

message GetOrderFullInfoRequest{
  int32 orderId = 1;
}
message GetOrderFullInfoResponse{
  int32 ClientId = 1;
  string ClientName = 2;
  string ClientEmail = 3;
  string ClientPhone = 4;
  string ClientAddress = 5;
  string ClientCreatedAt = 6;

  int32 OrderId = 7;
  double OrderTotalAmount = 8;
  OrderStatus OrderStatus = 9;

  int32 TaskId = 10;
  string TaskTitle = 11;
  string TaskDescription = 12;
  int32 TaskStatus = 13;

  int32 UserId = 14;
  string UserName = 15;
  string UserEmail = 16;
  int32 UserRole = 17;
  bool IsUserEmailConfirmed = 18;
}