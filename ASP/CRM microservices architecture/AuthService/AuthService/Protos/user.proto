syntax = "proto3";

option csharp_namespace = "CRMSolution.Grpc";

package user;

service UserService {
  rpc GetUserById (GetUserByIdRequest) returns (UserResponse);
  rpc FindUser (FindUserRequest) returns (FindUserResponse); // <-- Новый метод
}

// Поиск пользователя по Id
message GetUserByIdRequest {
  string id = 1;
}

// Ответ на поиск пользователя по Id
message UserResponse {
  string id = 1;
  string username = 2;
  string email = 3;
  string role = 4;
}

// Поиск пользователя по Email
message FindUserRequest {
  string email = 1;
}

// Ответ на поиск пользователя по Email
message FindUserResponse {
  string id = 1;
  string username = 2;
  string email = 3;
  string role = 4;
}
