apiVersion: v1
kind: ConfigMap
metadata:
  name: crm-config
  namespace: crm-system
data:
  # Auth Service
  AuthService__ConnectionStrings__DefaultConnection: "Host=auth-db;Database=auth_db;Username=postgres;Password=secret"
  
  # Client Service
  ClientService__ConnectionStrings__DefaultConnection: "Host=client-db;Database=client_db;Username=postgres;Password=secret"
  
  # Order Service
  OrderService__ConnectionStrings__DefaultConnection: "Host=order-db;Database=order_db;Username=postgres;Password=secret"
  
  # Task Service
  TaskService__ConnectionStrings__DefaultConnection: "Host=task-db;Database=task_db;Username=postgres;Password=secret"
  
  # Twilio Service
  TwilioService__ConnectionStrings__DefaultConnection: "Host=twilio-db;Database=twilio_db;Username=postgres;Password=secret" 