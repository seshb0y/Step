apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: crm-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: crm-microservices-frontend:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 80
        env:
          - name: VITE_API_URL
            value: "http://127.0.0.1:53843/api/v1"
          - name: VITE_SIGNALR_URL
            value: "http://127.0.0.1:53843/notificationHub"

        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: nginx.conf
      volumes:
      - name: nginx-config
        configMap:
          name: frontend-nginx-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx-config
  namespace: crm-system
data:
  nginx.conf: |
    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }

        location /assets/ {
            alias /usr/share/nginx/html/assets/;
            expires 1y;
            add_header Cache-Control "public";
            add_header Content-Type $content_type;
        }

        location ~ \.(js|mjs)$ {
            add_header Content-Type application/javascript;
            add_header Cache-Control "no-cache";
        }

        location ~ \.css$ {
            add_header Content-Type text/css;
            add_header Cache-Control "no-cache";
        }

        location ~ \.(png|jpg|jpeg|gif|ico|svg)$ {
            add_header Cache-Control "public";
            expires 1y;
        }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: crm-system
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
